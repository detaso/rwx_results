name: Release Draft

on:
  push:
    branches: [main]

permissions:
  contents: write

# Let the in-progress run finish instead of cancelling it, so its
# delete-then-create sequence always completes and there is never a moment with
# no `next` draft. With cancel-in-progress: true a run could be killed between
# the delete and the create, leaving no draft until someone merged again.
# GitHub still keeps only one pending run per group, so a rapid intermediate
# merge's run is dropped before it starts -- harmless, because notes are
# generated server-side from --target "${GITHUB_SHA}" and the surviving pending
# run targets a newer commit.
concurrency:
  group: release-draft
  cancel-in-progress: false

jobs:
  update_draft:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Recreate draft release with generated notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Capture stdout and stderr separately so a genuine "not found" can be
          # told apart from an auth/rate-limit/network failure. Swallowing stderr
          # would make a transient error look like absence, skip the delete, and
          # leave a second draft named next behind.
          view_stderr="$(mktemp)"

          if is_draft="$(gh release view next --json isDraft --jq '.isDraft' 2>"${view_stderr}")"; then
            if [ "${is_draft}" = "true" ]; then
              # Draft releases carry no git tag, so deleting one touches nothing.
              # Never pass --cleanup-tag here.
              gh release delete next --yes
            fi
          elif grep -qi 'release not found' "${view_stderr}"; then
            echo "No release named next yet; creating the first draft."
          else
            echo "gh release view next failed for a reason other than not-found:" >&2
            cat "${view_stderr}" >&2
            exit 1
          fi

          # Generate the notes ourselves rather than with --generate-notes, so we
          # control two things gh cannot express for a draft:
          #
          # 1. previous_tag_name. Left to infer, GitHub picked v1.1.0 rather than
          #    v1.2.0, so every PR already shipped in v1.2.0 reappeared in the
          #    draft. releases/latest is the right baseline: it excludes drafts.
          # 2. tag_name. The generated "Full Changelog" footer always compares
          #    against the release's own tag, and a draft has no tag -- so a
          #    tag_name of "next" produced a 404 link. Passing the target sha
          #    instead makes GitHub write a link that resolves.
          #
          # The release itself is still created under the stable name "next", so
          # the lookup above keeps working; only the generated text differs.
          # Discriminate a real 404 from an API failure, for the same reason as
          # the block above: falling back on a transient error would let GitHub
          # infer the baseline, and inference is exactly what produced the
          # already-shipped-PR bug. `gh api` exits 1 for both, so only stderr
          # tells them apart -- "Not Found (HTTP 404)" here, where the release
          # subcommand above says "release not found".
          latest_stderr="$(mktemp)"

          if previous_tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name' 2>"${latest_stderr}")"; then
            echo "Generating notes since ${previous_tag}"
            notes="$(gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              -X POST \
              -f tag_name="${GITHUB_SHA}" \
              -f previous_tag_name="${previous_tag}" \
              --jq '.body')"
          elif grep -q 'HTTP 404' "${latest_stderr}"; then
            echo "No published release yet; letting GitHub choose the baseline"
            notes="$(gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              -X POST \
              -f tag_name="${GITHUB_SHA}" \
              --jq '.body')"
          else
            echo "gh api releases/latest failed for a reason other than not-found:" >&2
            cat "${latest_stderr}" >&2
            exit 1
          fi

          gh release create next \
            --draft \
            --target "${GITHUB_SHA}" \
            --title "Unreleased" \
            --notes "${notes}"
