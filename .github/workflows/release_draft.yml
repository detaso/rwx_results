name: Release Draft

on:
  push:
    branches: [main]

permissions:
  contents: write

# Queue rapid merges instead of cancelling them. Each run completes its own
# delete-then-create against its own checkout, and the last to finish leaves the
# correct notes. With cancel-in-progress: true an intermediate run could be
# killed between the delete and the create, leaving no `next` draft until
# someone merged again. Both converge eventually; only this one has no window
# where the draft is missing.
concurrency:
  group: release-draft
  cancel-in-progress: false

jobs:
  update_draft:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Recreate draft release with generated notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Draft releases carry no git tag, so deleting one touches nothing.
          # Never pass --cleanup-tag here.
          if gh release view next --json isDraft --jq '.isDraft' 2>/dev/null | grep -q true; then
            gh release delete next --yes
          fi

          gh release create next \
            --draft \
            --generate-notes \
            --target "${GITHUB_SHA}" \
            --title "Unreleased"
