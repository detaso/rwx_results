name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without a leading v (e.g. 1.2.0)"
        required: true
        type: string
      dry_run:
        description: "Build and verify without pushing anything"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: detaso/rwx_results
      VERSION: ${{ inputs.version }}
    steps:
      - name: Validate version and derive major
        run: |
          set -euo pipefail
          if ! [[ "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::version must be X.Y.Z with no leading v (got '${VERSION}')"
            exit 1
          fi
          echo "MAJOR=${VERSION%%.*}" >> "${GITHUB_ENV}"

      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Refuse to overwrite an existing release
        run: |
          set -euo pipefail
          if git rev-parse -q --verify "refs/tags/v${VERSION}" >/dev/null; then
            echo "::error::tag v${VERSION} already exists; immutable releases are never overwritten"
            exit 1
          fi

      - name: Bump image reference in both action files
        run: |
          set -euo pipefail
          IMAGE_REF="docker://${REGISTRY}/${IMAGE_NAME}:${VERSION}"
          for f in action.yml mark-outdated/action.yml; do
            yq ".runs.image = \"${IMAGE_REF}\"" -i "$f"
          done

      - name: Assert both files were rewritten
        run: |
          set -euo pipefail
          EXPECTED="docker://${REGISTRY}/${IMAGE_NAME}:${VERSION}"
          for f in action.yml mark-outdated/action.yml; do
            ACTUAL=$(yq -r '.runs.image' "$f")
            if [ "${ACTUAL}" != "${EXPECTED}" ]; then
              echo "::error::${f} reads '${ACTUAL}', expected '${EXPECTED}'"
              exit 1
            fi
            echo "${f}: ${ACTUAL}"
          done
          git --no-pager diff --stat

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        if: ${{ inputs.dry_run == false }}
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pushed before the release commit reaches main. main's action.yml must
      # never name an image that does not exist, so a failed build has to abort
      # the run while main is still untouched.
      - name: Build and push the immutable version image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: ${{ inputs.dry_run == false }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.version }}
          platforms: linux/amd64
          provenance: false
          sbom: false

      - name: Commit and push the release commit
        if: ${{ inputs.dry_run == false }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add action.yml mark-outdated/action.yml
          git commit -m "Release v${VERSION}"
          git push origin main

      - name: Move the floating image tags
        if: ${{ inputs.dry_run == false }}
        run: |
          set -euo pipefail
          SRC="${REGISTRY}/${IMAGE_NAME}:${VERSION}"
          docker buildx imagetools create \
            --tag "${REGISTRY}/${IMAGE_NAME}:v${MAJOR}" \
            --tag "${REGISTRY}/${IMAGE_NAME}:latest" \
            "${SRC}"

      - name: Create and push git tags
        if: ${{ inputs.dry_run == false }}
        run: |
          set -euo pipefail
          git tag "v${VERSION}"
          git push origin "v${VERSION}"
          git tag -f "v${MAJOR}"
          git push -f origin "v${MAJOR}"

      - name: Publish the release notes
        if: ${{ inputs.dry_run == false }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # A missing draft is normal: the first release has none, and neither
          # does a release cut right after another. Capture stdout and stderr
          # separately so a genuine "not found" can be told apart from an
          # auth/rate-limit/network failure. Swallowing stderr would make a
          # transient error look like absence, skip the delete, and leave the
          # stale next draft sitting beside the release just published.
          view_stderr="$(mktemp)"

          if is_draft="$(gh release view next --json isDraft --jq '.isDraft' 2>"${view_stderr}")"; then
            if [ "${is_draft}" = "true" ]; then
              # Draft releases carry no git tag, so deleting one touches nothing.
              # Never pass --cleanup-tag here.
              gh release delete next --yes
            fi
          elif grep -qi 'release not found' "${view_stderr}"; then
            echo "No release named next; nothing to remove."
          else
            echo "gh release view next failed for a reason other than not-found:" >&2
            cat "${view_stderr}" >&2
            exit 1
          fi

          gh release create "v${VERSION}" \
            --verify-tag \
            --generate-notes \
            --title "v${VERSION}"

      - name: Dry run summary
        if: ${{ inputs.dry_run == true }}
        run: |
          echo "::notice::dry run complete for v${VERSION} — nothing was committed, tagged, or pushed"
